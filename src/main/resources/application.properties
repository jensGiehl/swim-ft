spring.application.name=schwimmkurs-ft
spring.main.web-application-type=none
spring.main.banner-mode=off

schwimmkurs.source.url=https://baeder-ft.baeder-suite.de/de/bookings/block_list/course_id/555/?tab=154&items_per_page=100&page=1
schwimmkurs.source.table-selector=#block_list_154
schwimmkurs.source.user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:143.0) Gecko/20100101 Firefox/143.0
schwimmkurs.source.connect-timeout=10s
schwimmkurs.source.read-timeout=30s

schwimmkurs.state.file=./data/schwimmkurs-state.bin
schwimmkurs.state.lock-file=./data/schwimmkurs-state.lock

schwimmkurs.telegram.api-base-url=https://api.telegram.org
schwimmkurs.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
schwimmkurs.telegram.chat-id=${TELEGRAM_CHAT_ID:}
schwimmkurs.telegram.disable-notification=false
schwimmkurs.telegram.maximum-message-length=3900

schwimmkurs.health-check.enabled=true
schwimmkurs.health-check.day-of-week=SUNDAY
schwimmkurs.health-check.earliest-time=18:00
schwimmkurs.health-check.zone-id=Europe/Berlin
schwimmkurs.health-check.message=Schwimmkurs-Monitor läuft weiterhin und konnte die Kursseite erfolgreich prüfen.
